[project]
name = "kautilya"
version = "0.1.0"
description = "Hybrid Knowledge Exploration Laboratory"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kautilya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[project.scripts]
kautilya = "kautilya.cli:main"
