benchmark_id: s8_exploration_benchmark
description: "S8 Knowledge Exploration benchmark evaluating multi-source bounded exploration, path discovery, and evidence recall across the controlled Knowledge World."
version: "1.0.0"
questions:
  # ── Category 1: exploration_requires_reasoning ──
  - id: s8_q01
    category: exploration_requires_reasoning
    question: "Who founded the company that acquired Vector Labs?"
    reasoning_type: multi_hop_chain
    expected_seed_entities: ["Vector Labs"]
    expected_paths:
      - ["Vector Labs", "ACQUIRED", "Nova Systems", "FOUNDED", "Rohan Kapoor"]
    expected_evidence:
      - chunk_id: "chunk_001_001"
      - chunk_id: "chunk_012_001"

  - id: s8_q02
    category: exploration_requires_reasoning
    question: "Who co-founded the company that Nova Systems acquired?"
    reasoning_type: multi_hop_chain
    expected_seed_entities: ["Nova Systems"]
    expected_paths:
      - ["Nova Systems", "ACQUIRED", "Vector Labs", "CO_FOUNDED", "Mira Sharma"]
      - ["Nova Systems", "ACQUIRED", "Vector Labs", "CO_FOUNDED", "Anand Iyer"]
    expected_evidence:
      - chunk_id: "chunk_002_001"
      - chunk_id: "chunk_006_001"

  - id: s8_q03
    category: exploration_requires_reasoning
    question: "Who acquired the company that developed HelixDB?"
    reasoning_type: multi_hop_chain
    expected_seed_entities: ["HelixDB"]
    expected_paths:
      - ["HelixDB", "DEVELOPED", "Vector Labs", "ACQUIRED", "Nova Systems"]
    expected_evidence:
      - chunk_id: "chunk_005_001"
      - chunk_id: "chunk_001_001"

  - id: s8_q04
    category: exploration_requires_reasoning
    question: "Which provider works with the company that built HelixDB?"
    reasoning_type: multi_hop_chain
    expected_seed_entities: ["HelixDB"]
    expected_paths:
      - ["HelixDB", "DEVELOPED", "Vector Labs", "PARTNERED_WITH", "Meridian Cloud"]
    expected_evidence:
      - chunk_id: "chunk_011_001"

  # ── Category 2: exploration_branching (Hub Exploration) ──
  - id: s8_q05
    category: exploration_branching
    question: "Explore all entities, acquisitions, and locations connected to Nova Systems."
    reasoning_type: hub_expansion
    expected_seed_entities: ["Nova Systems"]
    expected_paths:
