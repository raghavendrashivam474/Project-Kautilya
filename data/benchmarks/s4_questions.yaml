# S4 Evidence Fusion Benchmark
# ------------------------------------------
# Categories:
#   A. semantic_friendly  — lexical/topical questions where RAG should shine
#   B. structural_friendly — relation-typed questions where KAG should shine
#   C. agreement          — both retrievers should return the same chunk
#   D. complementary      — each retriever returns different-but-useful evidence
#   E. ambiguous_hub      — hub entities where KAG produces structural ties
#   F. hybrid_required    — questions where only fusion is expected to succeed

